<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Osito Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Osito Plan</title>
<link rel="icon" href="icon-64.png" type="image/png" sizes="64x64">

    <nav id="nav" aria-label="Secciones"></nav>
    <div class="nav-foot" id="navFoot"></div>

  <main id="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
